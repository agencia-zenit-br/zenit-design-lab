name: Deploy Design Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: design-lab-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy isolated Design Lab
    runs-on: ubuntu-latest
    environment: design-lab
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Build and push isolated image
        env:
          IMAGE: southamerica-east1-docker.pkg.dev/zenit-platform-labs/zenit-design-lab/zenit-design-lab
        run: |
          gcloud builds submit . \
            --project=zenit-platform-labs \
            --region=southamerica-east1 \
            --config=cloudbuild.yaml \
            --service-account=projects/zenit-platform-labs/serviceAccounts/zenit-design-lab-builder@zenit-platform-labs.iam.gserviceaccount.com \
            --gcs-source-staging-dir=gs://zenit-platform-labs-design-build/source \
            --substitutions="_IMAGE=${IMAGE},_TAG=${GITHUB_SHA}" \
            --quiet
      - name: Deploy Design Lab only
        env:
          IMAGE: southamerica-east1-docker.pkg.dev/zenit-platform-labs/zenit-design-lab/zenit-design-lab
        run: |
          gcloud run deploy zenit-design-lab \
            --project=zenit-platform-labs \
            --region=southamerica-east1 \
            --platform=managed \
            --image="${IMAGE}:${GITHUB_SHA}" \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=20 \
            --timeout=60 \
            --quiet
      - name: Verify health endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "https://zenit-design-lab-725877092709.southamerica-east1.run.app/healthz/"
